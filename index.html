<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio Ide — Media Ajar Literasi Digital (Pertemuan 1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12132B;--paper:#F7F5EF;--panel:#FFFFFF;--navy:#1B1B3A;--amber:#E7A93B;--coral:#E86A5C;--mint:#3FA796;--line:#C9C4B4;--shadow:0 10px 26px rgba(18,19,43,.10);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#F2F0E8;--paper:#141428;--panel:#1D1D3A;--line:#3A3A5C;--shadow:0 10px 26px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{--ink:#F2F0E8;--paper:#141428;--panel:#1D1D3A;--line:#3A3A5C;--shadow:0 10px 26px rgba(0,0,0,.35);}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;min-height:100dvh;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;overflow-x:hidden;}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:700;margin:0;}
.wrap{max-width:920px;margin:0 auto;padding:0 22px;width:100%;}
#trail{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);}
#trail .row{display:flex;align-items:center;gap:8px;padding:10px 16px;max-width:920px;margin:0 auto;overflow-x:auto;}
.node{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;background:var(--panel);color:var(--ink);}
.node.done{background:var(--mint);border-color:var(--mint);color:#fff;}
.node.active{background:var(--amber);border-color:var(--amber);color:var(--navy);transform:scale(1.18);}
.seg{flex:1 1 8px;height:2px;background:var(--line);min-width:8px;}.seg.done{background:var(--mint);}
main{flex:1;display:flex;align-items:center;padding:28px 0 100px;}
.slide{width:100%;animation:in .35s ease;}
@keyframes in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion: reduce){.slide{animation:none;}}
.eyebrow{color:var(--coral);font-weight:600;font-size:14px;}
h2.title{font-size:clamp(26px,4.4vw,40px);line-height:1.15;margin:6px 0 14px;}
p.lede{font-size:17px;line-height:1.6;max-width:70ch;opacity:.92;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);}
.grid{display:grid;gap:14px;}.g2{grid-template-columns:1fr 1fr;}.g3{grid-template-columns:repeat(3,1fr);}
@media (max-width:700px){.g2,.g3{grid-template-columns:1fr;}}
.flip{perspective:1000px;height:190px;cursor:pointer;}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
.flip.on .flip-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;box-shadow:var(--shadow);text-align:center;}
.back{transform:rotateY(180deg);background:var(--navy);color:#fff;font-size:13.5px;line-height:1.45;}
.icon{font-size:36px;margin-bottom:8px;}.hint{font-size:12px;opacity:.6;margin-top:6px;}
ul.bullets{padding-left:20px;margin:10px 0;line-height:1.6;}ul.bullets li{margin-bottom:8px;}
.btnrow{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;}
button.btn{font:inherit;font-weight:600;border:none;border-radius:999px;padding:12px 22px;cursor:pointer;background:var(--navy);color:#fff;}
button.btn:active{transform:scale(.96);}button.btn:disabled{opacity:.4;cursor:default;}
button.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink);}
button.btn.amber{background:var(--amber);color:var(--navy);}
.chipbtn{font:inherit;font-weight:600;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;}
.chipbtn.on{background:var(--amber);border-color:var(--amber);color:var(--navy);}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:8px;cursor:pointer;font:inherit;color:var(--ink);}
.opt:hover{border-color:var(--amber);}
.opt.correct{border-color:var(--mint);background:rgba(63,167,150,.15);}
.opt.wrong{border-color:var(--coral);background:rgba(232,106,92,.15);}
.opt:disabled{cursor:default;}
.feedback{font-size:14px;font-weight:600;margin-top:8px;min-height:20px;line-height:1.5;}
.score-hero{text-align:center;padding:20px 0;}.score-num{font-size:64px;font-family:'Space Grotesk';font-weight:700;color:var(--amber);}
textarea.reflect,textarea.inp,input.inp{width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);color:var(--ink);}
textarea.reflect{min-height:80px;resize:vertical;}
label.qlabel{display:block;font-weight:600;margin:14px 0 6px;}
.small{font-size:13px;opacity:.7;}
.flow-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0;}
.flow-node{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;min-width:100px;font-size:13px;font-weight:600;cursor:pointer;}
.flow-node.active{border-color:var(--amber);background:rgba(231,169,59,.18);transform:scale(1.06);}
.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media (max-width:700px){.frames{grid-template-columns:1fr 1fr;}}
.frame{border:2px dashed var(--line);border-radius:10px;padding:10px;min-height:96px;font-size:13px;background:var(--panel);}
.frame b{color:var(--coral);}
.meter{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0;}
.meter>i{display:block;height:100%;background:var(--mint);width:0;transition:width .3s;}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.chk input{margin-top:4px;width:18px;height:18px;}
.poster{border-radius:14px;padding:22px;min-height:190px;transition:all .3s;}
.poster.bad{background:linear-gradient(90deg,#f3e46b,#9be36f);color:#e8d95c;font-size:11px;line-height:1.1;font-family:'Comic Sans MS',cursive;}
.poster.good{background:var(--navy);color:#fff;font-size:15px;line-height:1.5;}
.poster.good h3{font-size:28px;color:var(--amber);margin-bottom:10px;}
.ratio-box{margin:10px auto;background:var(--navy);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;transition:all .3s;}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:20;}
.footrow{max-width:920px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;}
</style>
</head>
<body>
<nav id="trail"><div class="row" id="trailRow"></div></nav>
<main><div class="wrap" id="stage"></div></main>
<footer><div class="footrow">
<button class="btn ghost" id="prevBtn" onclick="go(-1)">← Kembali</button>
<span class="small" id="progressLabel"></span>
<button class="btn" id="nextBtn" onclick="go(1)">Lanjut →</button>
</div></footer>
<script>
let cur=0,SLIDES=[],LABELS=[],QUIZ=[],quizIdx=0,quizScore=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function hero(eb,t,l){return `<div class="eyebrow">${eb}</div><h2 class="title">${t}</h2>${l?`<p class="lede">${l}</p>`:''}`;}
function bullets(a){return `<ul class="bullets">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;}
function flipGrid(items,cls){return `<div class="grid ${cls||'g3'}">${items.map(c=>`<div class="flip" onclick="this.classList.toggle('on')"><div class="flip-inner"><div class="face"><div class="icon">${c.icon}</div><b>${c.n}</b><div class="hint">${c.sub||'ketuk untuk membalik'}</div></div><div class="face back"><div>${c.fn}</div></div></div></div>`).join('')}</div>`;}
// blok skenario: tiap butir dijawab sendiri-sendiri
function scenarioBlock(id,items){
  window['SC_'+id]=items;
  return items.map((it,k)=>`<div class="card" style="margin-bottom:12px;"><b>${it.q}</b><div id="sc${id}_${k}">${it.opts.map((o,i)=>`<button class="opt" onclick="scAnswer('${id}',${k},${i})">${o}</button>`).join('')}</div><div class="feedback" id="scf${id}_${k}"></div></div>`).join('');
}
function scAnswer(id,k,i){
  const it=window['SC_'+id][k];
  document.querySelectorAll(`#sc${id}_${k} .opt`).forEach((b,idx)=>{b.disabled=true;if(idx===it.a)b.classList.add('correct');else if(idx===i)b.classList.add('wrong');});
  const f=$(`scf${id}_${k}`);f.style.color=i===it.a?'var(--mint)':'var(--coral)';f.textContent=(i===it.a?'✅ Tepat! ':'❌ Belum tepat. ')+it.why;
}
function quizSlide(){
  if(quizIdx>=QUIZ.length){return hero('HASIL KUIS FORMATIF','Selesai! 🎉','')+`<div class="card score-hero"><div class="score-num">${quizScore}/${QUIZ.length}</div><p class="lede" style="margin:8px auto 0;">${quizScore===QUIZ.length?'Sempurna! Pemahamanmu sudah mantap.':quizScore>=3?'Bagus! Sedikit lagi kamu menguasai semuanya.':'Yuk ulangi materinya, lalu coba kuis sekali lagi.'}</p><div class="btnrow" style="justify-content:center;"><button class="btn amber" onclick="quizReset()">↺ Ulangi kuis</button></div></div>`;}
  const it=QUIZ[quizIdx];
  return hero(`KUIS FORMATIF · SOAL ${quizIdx+1}/${QUIZ.length}`,'Uji pemahamanmu','')+`<div class="card"><p style="font-size:17px;font-weight:600;">${it.q}</p><div id="optBox">${it.opts.map((o,i)=>`<button class="opt" onclick="answerQuiz(${i})">${o}</button>`).join('')}</div><div class="feedback" id="quizFeedback"></div></div>`;
}
function answerQuiz(i){
  const it=QUIZ[quizIdx];
  document.querySelectorAll('#optBox .opt').forEach((b,idx)=>{b.disabled=true;if(idx===it.a)b.classList.add('correct');else if(idx===i)b.classList.add('wrong');});
  const f=$('quizFeedback');
  if(i===it.a){quizScore++;f.style.color='var(--mint)';f.textContent='✅ Benar!';}else{f.style.color='var(--coral)';f.textContent='❌ Belum tepat, jawaban benar ditandai hijau.';}
  setTimeout(()=>{quizIdx++;render();},900);
}
function quizReset(){quizScore=0;quizIdx=0;render();}
function reflectSlide(qs){return hero('REFLEKSI','Sebelum kita tutup…','')+`<div class="card">${qs.map((q,i)=>`<label class="qlabel">${i+1}. ${q}</label><textarea class="reflect"></textarea>`).join('')}</div><p class="small" style="margin-top:12px;">✍️ Tuliskan jawabanmu, lalu sampaikan secara lisan kepada guru/kelompokmu.</p>`;}
function renderTrail(){let h='';SLIDES.forEach((_,i)=>{h+=`<div class="node ${i<cur?'done':''} ${i===cur?'active':''}" onclick="jump(${i})" title="${LABELS[i]}">${i+1}</div>`;if(i<SLIDES.length-1)h+=`<div class="seg ${i<cur?'done':''}"></div>`;});$('trailRow').innerHTML=h;}
function render(){
  $('stage').innerHTML=`<div class="slide">${SLIDES[cur]()}</div>`;
  renderTrail();
  $('prevBtn').disabled=cur===0;
  $('nextBtn').style.visibility=cur===SLIDES.length-1?'hidden':'visible';
  $('progressLabel').textContent=`${cur+1} / ${SLIDES.length} · ${LABELS[cur]}`;
  window.scrollTo(0,0);
  if(window.afterRender)window.afterRender(cur);
}
function go(d){const n=cur+d;if(n>=0&&n<SLIDES.length){cur=n;render();}}
function jump(i){cur=i;render();}
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});

QUIZ=[{"q":"Unsur multimedia yang menyampaikan informasi melalui suara disebut…","opts":["Teks","Audio","Animasi","Grafik"],"a":1},{"q":"Tahap yang dilakukan PERTAMA dalam alur produksi konten digital adalah…","opts":["Perencanaan","Publikasi","Penyuntingan","Evaluasi"],"a":0},{"q":"Rangkaian sketsa adegan berurutan yang merencanakan tampilan visual sebuah video disebut…","opts":["Storyboard","Thumbnail","Caption","Timeline"],"a":0},{"q":"Lisensi yang mengizinkan pemakaian ulang dan modifikasi dengan syarat mencantumkan nama pencipta adalah…","opts":["CC BY","CC0","All Rights Reserved","CC BY-ND"],"a":0},{"q":"Agar pesan konten tepat sasaran, hal yang perlu dianalisis lebih dulu adalah…","opts":["Target audiens","Merek kamera","Harga aplikasi","Jumlah pengikut teman"],"a":0}];
LABELS=["Mulai","Apersepsi","Unsur","Alur","Audiens","Storyboard","Lisensi","Kuis","Refleksi","Selesai"];
const UNSUR=[
 {icon:"🔤",n:"Teks",fn:"Menyampaikan pesan tertulis: judul, caption, subtitle."},
 {icon:"🖼️",n:"Gambar",fn:"Visualisasi statis: foto, ilustrasi, infografis."},
 {icon:"🔊",n:"Audio",fn:"Informasi lewat suara: narasi, musik latar, podcast."},
 {icon:"🎬",n:"Video",fn:"Gambar bergerak dan suara: video pendek, tutorial."},
 {icon:"✨",n:"Animasi",fn:"Menghidupkan objek: motion graphic, GIF."},
 {icon:"👆",n:"Interaktif",fn:"Melibatkan aksi pengguna: kuis, presentasi berhyperlink."}];
const ALUR=[
 ["🧠","Perencanaan","Tentukan ide, tujuan, audiens, lalu susun naskah dan storyboard."],
 ["🎥","Produksi","Buat atau kumpulkan aset: foto, rekaman, suara, ilustrasi."],
 ["✂️","Penyuntingan","Susun, potong, beri teks/efek, dan rapikan hasil."],
 ["🚀","Diseminasi","Pilih platform, tulis caption, dan publikasikan."],
 ["📊","Evaluasi","Baca respons audiens, lalu perbaiki konten berikutnya."]];
let alurSel=0;
let SB={judul:"",s:["","","",""]};
function alurPick(i){alurSel=i;document.querySelectorAll('.flow-node').forEach((n,k)=>n.classList.toggle('active',k===i));$('alurDesc').innerHTML=`<b>${ALUR[i][1]}</b> — ${ALUR[i][2]}`;}
function sbUpdate(){
  SB.judul=$('sbJudul').value;
  for(let i=0;i<4;i++){SB.s[i]=$('sb'+i).value;}
  $('sbView').innerHTML=SB.s.map((t,i)=>`<div class="frame"><b>Adegan ${i+1}</b><br>${esc(t)||'<span class="small">…</span>'}</div>`).join('');
  const filled=SB.s.filter(x=>x.trim()).length;
  $('sbInfo').textContent=`${filled}/4 adegan terisi · estimasi durasi ${filled*10} detik (10 dtk/adegan)`;
}
SLIDES=[
()=>hero('LITERASI DIGITAL · FASE F · PERTEMUAN 1','🎬 Studio Ide: Merencanakan Konten','Konten yang memikat tidak lahir dari alat canggih, tetapi dari rencana yang matang. Hari ini kita menjadi sutradara sekaligus perencana.')+`<div class="card" style="margin-top:18px;"><b>Yang akan kita lakukan:</b>${bullets(['Mengenal 6 unsur multimedia','Memahami alur produksi–diseminasi konten','Memilih sajian yang tepat untuk audiens','Menyusun storyboard sendiri','Memahami hak cipta &amp; lisensi Creative Commons'])}</div><div class="btnrow"><button class="btn amber" onclick="go(1)">Mulai 🚀</button></div>`,
()=>hero('APERSEPSI','🤔 Dua video, satu topik','Bayangkan dua video tentang topik yang sama: satu direkam asal-asalan, satu direncanakan matang. Mana yang lebih ditonton sampai habis?')+`<div class="card"><b>Diskusikan:</b>${bullets(['Apa yang membuat sebuah konten terasa terencana?','Bolehkah kita memakai gambar apa pun dari internet?','Apa yang perlu kita tahu tentang penonton sebelum membuat konten?'])}<textarea class="reflect" placeholder="Tuliskan dugaanmu (opsional)…"></textarea></div>`,
()=>hero('UNSUR MULTIMEDIA · 6/6','Enam bahan dasar sajian multimedia','Ketuk kartu untuk melihat fungsi tiap unsur.')+flipGrid(UNSUR,'g3'),
()=>hero('ALUR PRODUKSI','Dari ide sampai evaluasi','Klik setiap tahap untuk melihat penjelasannya.')+`<div class="card"><div class="flow-row">${ALUR.map((a,i)=>`<div class="flow-node ${i===alurSel?'active':''}" onclick="alurPick(${i})"><div class="icon">${a[0]}</div>${a[1]}</div>${i<4?'<span style="opacity:.5;font-size:20px;">→</span>':''}`).join('')}</div><p class="lede" id="alurDesc" style="text-align:center;margin:0 auto;"><b>${ALUR[alurSel][1]}</b> — ${ALUR[alurSel][2]}</p></div>`,
()=>hero('ANALISIS AUDIENS','Pilih sajian yang paling tepat','Setiap audiens punya kebutuhan berbeda. Jawab tiga kasus berikut.')+scenarioBlock('a',[
 {q:'OSIS ingin mengenalkan jurusan SMK ke siswa SMP yang aktif di TikTok. Sajian terbaik?',opts:['Video vertikal singkat 30–45 detik','Laporan PDF 40 halaman','Tabel angka statistik','Surat resmi tercetak'],a:0,why:'Audiens muda di platform video pendek → video vertikal singkat.'},
 {q:'Kamu ingin menjelaskan langkah-langkah instalasi aplikasi kepada guru. Sajian terbaik?',opts:['Infografis/PDF langkah bergambar','Video musik tanpa narasi','Meme satu gambar','Podcast tanpa teks'],a:0,why:'Panduan langkah paling mudah diikuti dalam bentuk visual bertahap yang bisa dibuka ulang.'},
 {q:'Kamu ingin mengajak warga sekolah ikut kerja bakti Jumat pagi. Sajian terbaik?',opts:['Poster digital singkat dengan ajakan jelas','Artikel jurnal 10 halaman','Video 20 menit tanpa ajakan','Tabel jadwal petugas kebersihan'],a:0,why:'Ajakan cepat butuh pesan ringkas, visual kuat, dan call to action yang jelas.'}]),
()=>hero('STORYBOARD BUILDER','Rancang 4 adegan konten kelompokmu','Isi ide singkat tiap adegan. Pratinjau storyboard muncul otomatis.')+`<div class="card"><input id="sbJudul" class="inp" placeholder="Judul konten…" oninput="sbUpdate()" value="${esc(SB.judul)}"><div class="grid g2" style="margin-top:12px;">${[0,1,2,3].map(i=>`<textarea id="sb${i}" class="inp" rows="2" placeholder="Adegan ${i+1}: visual + narasi singkat…" oninput="sbUpdate()">${esc(SB.s[i])}</textarea>`).join('')}</div><p class="small" id="sbInfo" style="margin-top:10px;"></p><div class="frames" id="sbView" style="margin-top:8px;"></div></div>`,
()=>hero('HAK CIPTA &amp; LISENSI','Aset mana yang boleh dipakai?','Karya di internet umumnya dilindungi hak cipta. Cek lisensinya!')+flipGrid([
 {icon:"🅱️",n:"CC BY",fn:"Boleh dipakai dan dimodifikasi. Wajib mencantumkan nama pencipta."},
 {icon:"🔁",n:"CC BY-SA",fn:"Seperti CC BY, tetapi hasil turunan harus memakai lisensi yang sama."},
 {icon:"🚫💰",n:"CC BY-NC",fn:"Boleh dipakai dengan atribusi, tidak boleh untuk tujuan komersial."},
 {icon:"🕊️",n:"CC0",fn:"Dilepas ke domain publik. Tidak wajib atribusi (tetap baik mencantumkan)."}],'g2'),
()=>quizSlide(),
()=>reflectSlide(['Bagian mana dari perencanaan konten yang paling mudah dan paling sulit bagimu?','Apakah kamu sudah mampu menentukan audiens dan bentuk sajian yang tepat?','Apa yang akan kamu siapkan untuk pertemuan produksi berikutnya?']),
()=>hero('SAMPAI JUMPA','🏁 Rencana konten siap!','Kamu sudah punya bekal untuk merencanakan konten: unsur multimedia, alur kerja, analisis audiens, storyboard, dan etika aset.')+`<div class="card"><b>Langkah selanjutnya:</b>${bullets(['Lengkapi naskah &amp; daftar aset berlisensi kelompokmu','Pertemuan 2: produksi dan penyuntingan konten','Bawa aset (foto/rekaman) yang sudah kamu kumpulkan'])}</div><p class="small" style="margin-top:14px;">💡 Ingat: gunakan aset secara jujur — cek lisensi dan cantumkan sumber.</p>`
];
window.afterRender=i=>{if(i===5)sbUpdate();};
render();

</script>
</body>
</html>
